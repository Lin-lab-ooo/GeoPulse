let active=0,filtered=[];
const select=document.querySelector('#family'),list=document.querySelector('#list'),plot=document.querySelector('#plot');
function show(index){
 active=index;const chart=filtered[index];if(!chart)return;
 const png=chart.files.find(f=>f.file.endsWith('.png')).file,svg=chart.files.find(f=>f.file.endsWith('.svg')).file;
 plot.src=png;plot.alt=chart.title;
 document.querySelector('#png').href=png;document.querySelector('#svg').href=svg;document.querySelector('#page').href=chart.page;
 document.querySelector('#counter').textContent=`${index+1} / ${filtered.length} · ${chart.title}`;
 const notes=document.querySelector('#notes');notes.replaceChildren();chart.notes.forEach(text=>{const p=document.createElement('p');p.textContent=text;notes.append(p)});
 list.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-current',String(i===index)));
 document.querySelector('#previous').disabled=index===0;document.querySelector('#next').disabled=index===filtered.length-1;
}
function filter(){filtered=charts.filter(c=>c.family===select.value);list.replaceChildren();filtered.forEach((chart,index)=>{const button=document.createElement('button');button.className='chart-item';button.textContent=chart.title;button.addEventListener('click',()=>show(index));list.append(button)});show(0)}
select.addEventListener('change',filter);document.querySelector('#previous').addEventListener('click',()=>show(active-1));document.querySelector('#next').addEventListener('click',()=>show(active+1));
document.addEventListener('keydown',event=>{if(event.target.tagName==='SELECT')return;if(event.key==='ArrowRight'&&active<filtered.length-1)show(active+1);if(event.key==='ArrowLeft'&&active>0)show(active-1)});filter();
</script>
